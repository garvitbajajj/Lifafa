name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything a reviewer would otherwise have to take on trust: the RFC test vectors, the ledger
  # and claim guarantees against a real PostgreSQL, the HTTP contract, and every named attack.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test suite
        env:
          NO_COLOR: '1'
        # Failed tests become annotations through the github-actions reporter. Anything that fails
        # outside a test - an error during teardown, say - does not, so on failure the tail of the
        # output is surfaced as an annotation too: annotations are readable without a login.
        run: |
          if ! npx vitest run --reporter=default --reporter=github-actions > vitest.log 2>&1; then
            cat vitest.log
            echo "::error title=vitest failed::$(tail -80 vitest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          cat vitest.log

      # The command the README tells people to run, proven to work - not just the code behind it.
      - name: Every attack scenario through the command line
        run: npm run scenarios -- all

      - name: Build the dashboard
        run: npm run build
